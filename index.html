  <style>
  /* Siguraduhing walang sobrang margin o padding at maging responsive ang layout */
* {
  box-sizing: border-box;
  margin: 10px;
  padding: 0;
}
  {
  width: 100%;
  max-width: 100vw;
  padding: 20px;
  text-align: center; /* Para nakagitna ang text */
  font-family: sans-serif;
  overflow-x: hidden; /* Iwas sa sobrang scroll sa gilid */
}

/* Siguraduhing responsive ang mga imahe */
img {
  max-width: 100%;
  height: auto;
}

/* Adjustments para sa mga text */
p, h1, h2 {
  max-width: 100%;
  word-wrap: break-word;
}
  
  .fav-btn {
  display: inline-block;
  margin-top: 25px; /* Maglalagay ng agwat mula sa text sa itaas */
  padding: 12px 24px;
  background-color: #ff4d6d; /* Kulay ng button mo */
  color: #fff0f3;
  text-decoration: none;
  border-radius: 20px; /* Mas bilugan para cute tingnan */
  font-weight: bold;
}
  
</style>
